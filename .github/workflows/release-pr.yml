name: Release PR

# Actions → Release PR → Run workflow → pick the bump. Opens (or updates) the
# dev → main PR and labels it; merging it releases, and the Build macOS app
# workflow bumps the version then. No label means patch.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      # Notes are optional, but the release refuses two "next" entries, so say so now rather than after the merge.
      - name: Check dev's release notes
        run: |
          COUNT=$(grep -c 'version: "next",' src/content/releases.ts || true)
          [[ "$COUNT" -le 1 ]] || { echo "::error::src/content/releases.ts on dev has $COUNT entries with version \"next\"; keep at most one"; exit 1; }

      - name: Open or update the PR and set its label
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          gh label create release:minor --color 1d76db --description "Release bumps the minor version" --force
          gh label create release:major --color b60205 --description "Release bumps the major version" --force
          PR=$(gh pr list --base main --head dev --state open --json number -q '.[0].number')
          if [[ -z "$PR" ]]; then
            gh pr create --base main --head dev --title "Release ($BUMP)" \
              --body "Merging this releases. The Build macOS app workflow bumps the version ($BUMP) and publishes it, using the \"next\" entry in \`src/content/releases.ts\` as the release notes."
            PR=$(gh pr list --base main --head dev --state open --json number -q '.[0].number')
          else
            gh pr edit "$PR" --title "Release ($BUMP)"
          fi
          gh pr edit "$PR" --remove-label release:minor --remove-label release:major
          [[ "$BUMP" == patch ]] || gh pr edit "$PR" --add-label "release:$BUMP"
